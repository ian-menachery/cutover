[project]
name = "cutover"
version = "0.1.0"
description = "Data-migration tie-out kit: reconcile a legacy export against the new system's export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ian Menachery" }]
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
cutover = "cutover.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["cutover.checks"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["gates/blind", "handoff"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
